name: CI

# Proves that main and every pull request still build on every platform.
# Packaging is not run here -- that is the Release workflow's job.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux --parallel

      - name: Check the binary was produced
        run: |
          test -x build/linux/UartX || { echo "build/linux/UartX was not built"; exit 1; }
          ls -la build/linux/UartX
          file build/linux/UartX

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw90'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Check the executable was produced
        shell: pwsh
        run: |
          $exe = "build/UartX.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          Get-Item $exe | Format-List Name, Length, VersionInfo

  macos:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The official Qt build is universal, so the app it links is too.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Install Ninja
        run: brew install ninja || true

      - name: Configure
        run: cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Check the bundle is universal
        run: |
          bin=build/macos/UartX.app/Contents/MacOS/UartX
          test -x "$bin" || { echo "$bin was not built"; exit 1; }
          lipo -archs "$bin"
          lipo -archs "$bin" | grep -q x86_64 && lipo -archs "$bin" | grep -q arm64
