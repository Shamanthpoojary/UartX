name: Release

# Builds the Windows installer and the portable zip and attaches them to a
# GitHub Release. Push a tag such as v1.0.0 to publish, or run the workflow by
# hand to get the artifacts without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than tracking latest: the installer bundles this Qt, so
      # the version shipped to users should change deliberately.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw90'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Build installer and portable zip
        run: |
          cmake --build build --target installer
          cmake --build build --target portable

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/installer/* dist/
          # Written byte by byte rather than with Set-Content: PowerShell's
          # cmdlets add a BOM and CRLF line endings, and either one makes
          # `sha256sum -c SHA256SUMS.txt` fail on Linux, macOS and Git Bash.
          $lines = Get-FileHash dist/* -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [System.IO.File]::WriteAllText(
              "$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n",
              (New-Object System.Text.UTF8Encoding $false))
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: uartx-windows
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Publish nothing rather than an empty release if a build step
          # produced no artifacts.
          fail_on_unmatched_files: true
